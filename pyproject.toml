[project]
name = "bm"
version = "0.1.0"
description = "Local, searchable mirror of your X (Twitter) bookmarks and likes and Hacker News favorites, with hybrid search, a CLI, an MCP server and an Agent Skill"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "harshavardhanab" }]
requires-python = ">=3.12,<3.14"
keywords = ["bookmarks", "twitter", "x", "hacker-news", "search", "sqlite", "mcp", "llm", "embeddings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "httpx>=0.27",
  "trafilatura>=1.12",
  "pypdf>=4.0",
  "playwright>=1.45",
  "fastembed>=0.4",
  "sqlite-vec>=0.1.6",
  "mcp>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/harshavardhanab/twitter_bookmarks"
Issues = "https://github.com/harshavardhanab/twitter_bookmarks/issues"

[project.scripts]
bm = "bm.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bm"]

# Ship the Agent Skill inside the package so `bm skill install` works without a clone
[tool.hatch.build.targets.wheel.force-include]
"skill/bookmarks/SKILL.md" = "bm/skill/SKILL.md"
